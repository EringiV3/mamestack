<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>麦畑ベーカリー</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f3ead7;
        --ink: #1c1915;
        --brick: #8c3a2f;
        --line: #d9cbb3;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, #faf6ee, transparent 42%),
          var(--paper);
        color: var(--ink);
        font-family: "WenQuanYi Micro Hei", "Droid Sans Fallback", sans-serif;
      }
      main {
        width: min(40rem, calc(100% - 2rem));
        margin: 0 auto;
        padding: 4.5rem 0 3rem;
      }
      .stamp {
        display: inline-block;
        border: 2px solid var(--brick);
        color: var(--brick);
        letter-spacing: 0.18em;
        font-size: 0.78rem;
        padding: 0.35rem 0.6rem;
      }
      h1 {
        font-size: clamp(2.4rem, 6vw, 4rem);
        line-height: 1.05;
        font-weight: 700;
        margin: 1.2rem 0 0.4rem;
      }
      .place { margin: 0; color: #4a433a; }
      #hours {
        margin: 2rem 0 0;
        padding: 1.25rem 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      #hours p { margin: 0.2rem 0; }
      .time {
        font-size: clamp(3rem, 8vw, 5.5rem);
        letter-spacing: -0.04em;
        line-height: 0.95;
      }
      .closed { color: var(--brick); }
      button {
        margin-top: 1.6rem;
        background: var(--ink);
        color: var(--paper);
        border: 0;
        font: inherit;
        padding: 0.85rem 1.1rem;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid var(--brick); outline-offset: 3px; }
      #bread-list {
        margin: 1rem 0 0;
        padding: 0;
        list-style: none;
      }
      #bread-list li {
        padding: 0.85rem 0;
        border-bottom: 1px solid var(--line);
        font-size: 1.35rem;
      }
      footer { margin-top: 2.5rem; color: #4a433a; font-size: 0.92rem; }
    </style>
  </head>
  <body>
    <main>
      <p class="stamp">本日の看板</p>
      <h1>麦畑ベーカリー</h1>
      <p class="place">最寄りを朝に通る人へ。仕込み中の店内には掲示しない。</p>
      <section id="hours" aria-label="本日の営業時間">
        <p>きょうの営業</p>
        <p class="time">8:00–15:00</p>
        <p class="closed">水曜は焼かない</p>
      </section>
      <button id="bread-toggle" type="button" aria-expanded="false" aria-controls="bread-list">
        今日焼いたパン
      </button>
      <ul id="bread-list" hidden>
        <li>カンパーニュ</li>
        <li>レーズン</li>
        <li>塩バターロール</li>
      </ul>
      <footer>売り切れの更新は、まだ店主のスマホからはできない。</footer>
    </main>
    <script>
      const button = document.querySelector("#bread-toggle");
      const list = document.querySelector("#bread-list");
      button.addEventListener("click", () => {
        const willOpen = list.hasAttribute("hidden");
        if (willOpen) {
          list.removeAttribute("hidden");
        } else {
          list.setAttribute("hidden", "");
        }
        button.setAttribute("aria-expanded", String(willOpen));
      });
    </script>
  </body>
</html>
